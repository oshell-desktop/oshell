name: Build and publish macOS DMGs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '可留空：按所选分支的 Info.plist 版本创建标签；填写时必须匹配源码版本'
        required: false
        type: string
      publish:
        description: '发布 GitHub Release（需配置更新签名 Secret）；关闭则仅编译两种 DMG'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: macos-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  dispatch:
    # Tag caches cannot be reused by the next tag. Forward tag-triggered runs
    # to the default branch; the actual build still checks out the pinned tag.
    if: github.event_name == 'push' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the tagged release from the shared cache branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" -f tag="$RELEASE_TAG" -f publish=true

  metadata:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Manual releases may create their missing version tag.
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
      commit: ${{ steps.meta.outputs.commit }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select the requested immutable source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$PUBLISH_RELEASE" = true ] && [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo '::error::Publish from the default branch so releases share validated caches.'
            exit 1
          fi
          if [ -n "$RELEASE_TAG" ]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            if [ "$PUBLISH_RELEASE" = true ] && git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}" >/dev/null; then
              git merge-base --is-ancestor "refs/tags/$RELEASE_TAG^{commit}" "$GITHUB_SHA"
              git checkout --detach "refs/tags/$RELEASE_TAG"
            fi
          fi
      - name: Validate release scripts and source
        run: |
          python3 scripts/check-public-source.py --history HEAD
          python3 scripts/test-ci-release.py
          python3 scripts/test-development-tools.py
          python3 scripts/test-code-signing.py
          python3 scripts/test-release-build.py
          python3 scripts/test-compilation-cache.py
          python3 scripts/test-incremental-cache.py
      - name: Resolve version and prepare immutable release tag
        id: meta
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          PUSH_TAG: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_RELEASE: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "publish=$PUBLISH_RELEASE" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH_RELEASE" != true ]; then
            python3 scripts/ci-release.py metadata --tag "$RELEASE_TAG" --build-only --github-output "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = workflow_dispatch ]; then
            python3 scripts/ci-release.py prepare --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/ci-release.py metadata --tag "$PUSH_TAG" --github-output "$GITHUB_OUTPUT"
          fi

  build:
    needs: metadata
    name: DMG / ${{ matrix.flavor }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - flavor: legacy
            runner: macos-15-intel
          - flavor: arm64
            runner: macos-15
    env:
      # Pin a toolchain that includes the macOS 10.13 Swift runtime.
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
      FLAVOR: ${{ matrix.flavor }}
      OSHELL_REQUIRE_FIXED_SIGNING: "1"
      PUBLISH_RELEASE: ${{ needs.metadata.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check toolchain and identify build cache
        id: toolchain
        run: |
          python3 scripts/check-release-toolchain.py --flavor "$FLAVOR" --github-output "$GITHUB_OUTPUT"
          echo "OSHELL_COMPILATION_CACHE_DIR=$RUNNER_TEMP/oshell-build-cache" >> "$GITHUB_ENV"
      - name: Restore compilation and incremental state
        id: build-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/oshell-build-cache
          key: ${{ steps.toolchain.outputs.cache-key }}
          restore-keys: ${{ steps.toolchain.outputs.cache-prefix }}-
      - name: Validate incremental dependency rebuilds
        if: matrix.flavor == 'arm64'
        run: python3 scripts/test-incremental-cache.py --swift-integration
      - name: Validate fixed code signing identity
        env:
          OSHELL_CODESIGN_P12: ${{ secrets.OSHELL_CODESIGN_P12 }}
          OSHELL_CODESIGN_PASSWORD: ${{ secrets.OSHELL_CODESIGN_PASSWORD }}
        run: |
          if [ -z "$OSHELL_CODESIGN_P12" ] || [ -z "$OSHELL_CODESIGN_PASSWORD" ]; then
            echo '::error::Configure OSHELL_CODESIGN_P12 and OSHELL_CODESIGN_PASSWORD with the pinned signing identity. Never generate a replacement certificate in CI.'
            exit 1
          fi
          python3 scripts/sign-app.py --preflight
      - name: Build application, run core checks and create DMG
        env:
          OSHELL_CODESIGN_P12: ${{ secrets.OSHELL_CODESIGN_P12 }}
          OSHELL_CODESIGN_PASSWORD: ${{ secrets.OSHELL_CODESIGN_PASSWORD }}
        run: python3 scripts/package-release.py --flavor "$FLAVOR" --format dmg --test-core
      - name: Verify DMG payload, architectures and deployment targets
        run: python3 scripts/verify-installers.py --flavor "$FLAVOR" --format dmg
      - name: Stage the verified artifact
        run: |
          options=()
          if [ "$PUBLISH_RELEASE" != true ]; then options+=(--build-only); fi
          python3 scripts/ci-release.py stage --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --flavor "$FLAVOR" --output work/ci-output "${options[@]}"
      - name: Set up cached Python signing dependencies
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-release.txt
      - name: Prepare and test update signing tools
        # Also run in build-only validation, so timing does not hide dependency
        # compilation; tests use synthetic keys and cannot publish anything.
        run: |
          python3 -m venv work/update-signing
          work/update-signing/bin/python -m pip install -r scripts/requirements-release.txt
          work/update-signing/bin/python scripts/test-update-pages.py
      - name: Sign verified DMG update metadata
        if: needs.metadata.outputs.publish == 'true'
        env:
          OSHELL_UPDATE_SIGNING_KEY: ${{ secrets.OSHELL_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$OSHELL_UPDATE_SIGNING_KEY" ]; then
            echo '::error::Configure the existing OSHELL_UPDATE_SIGNING_KEY secret before publishing. Signed Release metadata is required for in-app updates.'
            exit 1
          fi
          work/update-signing/bin/python scripts/sign-ci-updates.py --flavor "$FLAVOR" --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.metadata.outputs.publish == 'true'
        with:
          name: updates-${{ matrix.flavor }}
          path: work/ci-updates/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dmg-${{ matrix.flavor }}
          path: work/ci-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Save verified compilation cache
        if: steps.build-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/oshell-build-cache
          key: ${{ steps.toolchain.outputs.cache-key }}
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: diagnostics-${{ matrix.flavor }}
          path: |
            validation/package-*.log
            validation/package-*.json
          if-no-files-found: ignore
          retention-days: 7

  release:
    needs: [metadata, build]
    if: needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      OSHELL_REQUIRE_FIXED_SIGNING: "1"
      RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dmg-*
          path: work/release-input
          merge-multiple: false
      - name: Export corresponding audited source
        run: python3 scripts/export-public-source.py --ref "$RELEASE_COMMIT" --output "dist/source/OShell-${RELEASE_VERSION}-source.tar.gz"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: updates-*
          path: work/update-input
          merge-multiple: false
      - name: Require two matching DMGs and prepare checksums
        run: |
          python3 scripts/ci-release.py collect --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" \
            --artifacts work/release-input --updates-artifacts work/update-input --repository "$GITHUB_REPOSITORY" \
            --source "dist/source/OShell-${RELEASE_VERSION}-source.tar.gz" --output dist/github-release
      - name: Prepare original-repository update tools
        if: github.repository == 'oshell-desktop/oshell'
        run: |
          python3 -m venv work/compat-tools
          work/compat-tools/bin/python -m pip install -r scripts/requirements-release.txt
          work/compat-tools/bin/python scripts/test-legacy-updates.py
      - name: Prepare signed original-repository Pages metadata (two DMGs)
        if: github.repository == 'oshell-desktop/oshell'
        env:
          OSHELL_UPDATE_SIGNING_KEY: ${{ secrets.OSHELL_UPDATE_SIGNING_KEY }}
        run: work/compat-tools/bin/python scripts/publish-legacy-updates.py --tag "$RELEASE_TAG" --release-output dist/github-release --output work/compat-sites
      - name: Upload as draft, verify all assets, then publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-release.py publish --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --output dist/github-release
      - name: Update the original repository's Pages entry
        if: github.repository == 'oshell-desktop/oshell'
        env:
          GH_TOKEN: ${{ github.token }}
          OSHELL_LEGACY_PAGES_DEPLOY_KEY: ${{ secrets.OSHELL_LEGACY_PAGES_DEPLOY_KEY }}
        run: python3 scripts/deploy-legacy-pages.py --site work/compat-sites/legacy

  update-pages:
    needs: [metadata, release]
    if: needs.metadata.outputs.publish == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/update-pages.yml
